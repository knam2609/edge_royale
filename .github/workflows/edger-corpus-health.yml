name: Edger Corpus Health

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: edger-corpus-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      EDGER_CORPUS_STORE: ${{ vars.EDGER_CORPUS_STORE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.EDGER_AWS_ROLE_ARN }}
          role-duration-seconds: 43200

      - run: npm ci

      - name: Require durable S3 corpus storage
        run: |
          case "$EDGER_CORPUS_STORE" in
            s3://*) ;;
            *) echo "EDGER_CORPUS_STORE must be a configured s3:// URI" >&2; exit 1 ;;
          esac

      - name: Deterministic production canary
        run: npm run edger:canary -- --seed 20260718 --canary-ticks 80

      - name: Build compatible immutable manifest
        run: npm run edger:corpus:manifest -- --store "$EDGER_CORPUS_STORE" --out artifacts/edger-training/health/manifest.json

      - name: Validate corpus health and campaign trigger
        run: npm run edger:corpus:health -- --manifest artifacts/edger-training/health/manifest.json --report artifacts/edger-training/health/report.json

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: edger-corpus-health-${{ github.run_id }}
          path: artifacts/edger-training/health
          retention-days: 30

      - name: Dispatch recovery full-cache when reviewed SHA is configured and due
        if: vars.EDGER_AUTO_CAMPAIGNS == 'true' && vars.EDGER_RECOVERY_CAMPAIGN_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          should_trigger="$(node -e "const r=require('./artifacts/edger-training/health/report.json'); process.stdout.write(String(Boolean(r.campaign_trigger.should_trigger)))")"
          if [ "$should_trigger" = "true" ]; then
            campaign_uri="$(node -e "const r=require('./artifacts/edger-training/recovery/edger_scaling_recovery_v1.json'); process.stdout.write(r.target.campaign_uri)")"
            gh workflow run edger-campaign.yml \
              --ref main \
              -f operation=run \
              -f campaign_sha="${{ vars.EDGER_RECOVERY_CAMPAIGN_SHA }}" \
              -f campaign_uri="$campaign_uri" \
              -f target_stage=full-cache
          fi
