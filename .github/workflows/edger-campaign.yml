name: Edger Cumulative Campaign

on:
  workflow_dispatch:
    inputs:
      matches:
        description: "Paired snapshot-league games (even number)"
        required: false
        default: "32"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: edger-cumulative-campaign
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EDGER_CORPUS_STORE: ${{ vars.EDGER_CORPUS_STORE }}
      EDGER_CAMPAIGN_INPUT_URI: ${{ vars.EDGER_CAMPAIGN_INPUT_URI }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install -r requirements-edger-training.txt

      - name: Require durable S3 corpus storage
        run: |
          case "$EDGER_CORPUS_STORE" in
            s3://*) ;;
            *) echo "EDGER_CORPUS_STORE must be a configured s3:// URI" >&2; exit 1 ;;
          esac

      - name: Download shadow parent, live champion, scaling proof, and anchors
        if: env.EDGER_CAMPAIGN_INPUT_URI != ''
        run: |
          mkdir -p artifacts/edger-training/campaign-input
          aws s3 cp "$EDGER_CAMPAIGN_INPUT_URI/" artifacts/edger-training/campaign-input/ --recursive --only-show-errors

      - name: Require post-scaling campaign inputs
        run: |
          test -f artifacts/edger-training/campaign-input/scaling_report.json
          test -f artifacts/edger-training/campaign-input/shadow-parent.json
          test -f artifacts/edger-training/campaign-input/shadow-parent.pt
          test -f artifacts/edger-training/campaign-input/live-champion.json
          test -f artifacts/edger-training/campaign-input/live-champion-reference.json

      - name: Exact-JavaScript snapshot league and V-trace learner
        run: |
          matches="${{ inputs.matches }}"
          if [ -z "$matches" ]; then matches=32; fi
          league_args=()
          if [ -f artifacts/edger-training/campaign-input/league.json ]; then
            league_args=(--league artifacts/edger-training/campaign-input/league.json)
          fi
          historical_paths=()
          for anchor in artifacts/edger-training/campaign-input/historical-anchor-*.json; do
            if [ -f "$anchor" ]; then historical_paths+=("$anchor"); fi
          done
          historical_args=()
          if [ "${#historical_paths[@]}" -gt 0 ]; then
            historical="$(IFS=,; echo "${historical_paths[*]}")"
            historical_args=(--historical-anchors "$historical")
          fi
          npm run edger:train:league -- \
            --scaling-report artifacts/edger-training/campaign-input/scaling_report.json \
            --shadow-parent-model artifacts/edger-training/campaign-input/shadow-parent.json \
            --shadow-parent-checkpoint artifacts/edger-training/campaign-input/shadow-parent.pt \
            --live-champion-model artifacts/edger-training/campaign-input/live-champion.json \
            --live-champion-reference artifacts/edger-training/campaign-input/live-champion-reference.json \
            "${league_args[@]}" \
            "${historical_args[@]}" \
            --store "$EDGER_CORPUS_STORE" \
            --matches "$matches" \
            --workers 16 \
            --manifest-out artifacts/edger-training/campaign/manifest.json \
            --dataset-out artifacts/edger-training/campaign/league.parquet \
            --out-checkpoint artifacts/edger-training/campaign/candidate.pt \
            --report-out artifacts/edger-training/campaign/league_report.json

      - name: Export synchronous shadow actor
        run: |
          npm run edger:export:v2 -- \
            --checkpoint artifacts/edger-training/campaign/candidate.pt \
            --out artifacts/edger-training/campaign/edger_policy_v2_candidate.json
          npm run edger:generate:v2 -- \
            --model artifacts/edger-training/campaign/edger_policy_v2_candidate.json \
            --out artifacts/edger-training/campaign/edgerPolicyV2Candidate.js

      - name: Validate repository and browser
        run: |
          npm test
          mkdir -p artifacts/edger-training/campaign
          echo '{"passed":true,"command":"npm test"}' > artifacts/edger-training/campaign/test_report.json
          npm run smoke:browser
          echo '{"passed":true,"command":"npm run smoke:browser"}' > artifacts/edger-training/campaign/browser_report.json

      - name: Enforce exact-JavaScript evaluation throughput
        run: |
          npm run edger:benchmark:throughput -- \
            --candidate artifacts/edger-training/campaign/edger_policy_v2_candidate.json \
            --matches 32 \
            --workers 16 \
            --target-matches 11300 \
            --max-minutes 180 \
            --reference-hardware "${{ vars.EDGER_REFERENCE_HARDWARE || 'github-ubuntu-latest' }}" \
            --out artifacts/edger-training/campaign/throughput_report.json \
            --enforce

      - name: Run full v2 promotion evaluation
        run: |
          anchor_paths=()
          for anchor in artifacts/edger-training/campaign-input/historical-anchor-*.json; do
            if [ -f "$anchor" ]; then anchor_paths+=("$anchor"); fi
          done
          anchor_args=()
          if [ "${#anchor_paths[@]}" -gt 0 ]; then
            anchors="$(IFS=,; echo "${anchor_paths[*]}")"
            anchor_args=(--anchors "$anchors")
          fi
          npm run edger:evaluate:v2 -- \
            --candidate artifacts/edger-training/campaign/edger_policy_v2_candidate.json \
            --champion artifacts/edger-training/campaign-input/live-champion.json \
            "${anchor_args[@]}" \
            --reference artifacts/edger-training/campaign-input/live-champion-reference.json \
            --test-report artifacts/edger-training/campaign/test_report.json \
            --browser-report artifacts/edger-training/campaign/browser_report.json \
            --profile full \
            --workers 16 \
            --reference-hardware "${{ vars.EDGER_REFERENCE_HARDWARE || 'github-ubuntu-latest' }}" \
            --out artifacts/edger-training/campaign/evaluation_report.json

      - name: Prepare reviewed promotion artifact change
        run: npm run edger:promote:v2 -- --model artifacts/edger-training/campaign/edger_policy_v2_candidate.json --report artifacts/edger-training/campaign/evaluation_report.json

      - name: Open promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codex/edger-v2-promotion-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add artifacts/edger-training/promoted src/ai/generated/edgerPolicyCurrent.js
          git commit -m "Promote cumulative Edger v2 policy"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Promote cumulative Edger v2 policy" \
            --body "The cumulative v2 candidate passed the full paired, anchor, safety, parity, replay, tactical, timing, test, and browser promotion report. Campaign artifacts are attached to workflow run ${GITHUB_RUN_ID}."

      - name: Record completed cumulative corpus state
        run: npm run edger:campaign:complete -- --manifest artifacts/edger-training/campaign/manifest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edger-cumulative-campaign-${{ github.run_id }}
          path: artifacts/edger-training/campaign
          retention-days: 90
