name: Edger Production Campaign

on:
  workflow_dispatch:
    inputs:
      campaign_sha:
        description: "Reviewed campaign Git SHA (defaults to workflow main SHA)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: edger-production-campaign
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EDGER_CORPUS_STORE: ${{ vars.EDGER_CORPUS_STORE }}
  EDGER_CAMPAIGN_INPUT_URI: ${{ vars.EDGER_CAMPAIGN_INPUT_URI }}
  CAMPAIGN_GIT_SHA: ${{ inputs.campaign_sha || github.sha }}

jobs:
  remote-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.EDGER_AWS_ROLE_ARN }}
          role-duration-seconds: 43200

      - name: Require immutable production configuration
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$CAMPAIGN_GIT_SHA" "$GITHUB_SHA"
          test "$AWS_REGION" = "ap-southeast-2"
          case "$EDGER_CORPUS_STORE" in s3://*) ;; *) exit 1 ;; esac
          case "$EDGER_CAMPAIGN_INPUT_URI" in s3://*) ;; *) exit 1 ;; esac
          test "${{ vars.EDGER_REFERENCE_HARDWARE }}" = "aws-c7g.4xlarge-ap-southeast-2"

      - name: Launch the SSM-only c7g campaign runner
        run: npm run edger:campaign:remote -- launch --git-sha "$CAMPAIGN_GIT_SHA"

      - name: Wait for the immutable full-evaluation gate
        run: |
          campaign_uri="${EDGER_CAMPAIGN_INPUT_URI%/campaign-input}"
          for attempt in $(seq 1 350); do
            if aws s3 cp \
              "$campaign_uri/status/completed/full-evaluation.json" \
              /tmp/full-evaluation.json \
              --only-show-errors 2>/dev/null; then
              node -e "
                const fs = require('fs');
                const report = JSON.parse(fs.readFileSync('/tmp/full-evaluation.json'));
                if (report.status !== 'passed' || !report.immutable || report.git_commit !== process.env.CAMPAIGN_GIT_SHA) {
                  process.exit(1);
                }
              "
              exit 0
            fi
            active="$(aws ec2 describe-instances \
              --filters \
                "Name=tag:campaign,Values=20260718-v2-first" \
                "Name=tag:campaign-git-sha,Values=$CAMPAIGN_GIT_SHA" \
                "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'length(Reservations[].Instances[])' \
              --output text)"
            if [ "$active" = "0" ]; then
              echo "Remote runner terminated before the full-evaluation gate passed." >&2
              exit 1
            fi
            sleep 60
          done
          echo "Remote campaign exceeded the six-hour GitHub monitor window." >&2
          exit 1

  promotion-pr:
    needs: remote-campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.campaign_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.EDGER_AWS_ROLE_ARN }}
          role-duration-seconds: 43200

      - run: npm ci

      - name: Download exact checksum-bound promotion inputs
        run: |
          campaign_uri="${EDGER_CAMPAIGN_INPUT_URI%/campaign-input}"
          mkdir -p artifacts/edger-training/campaign
          aws s3 cp \
            "$campaign_uri/ready-for-promotion/" \
            artifacts/edger-training/campaign/ \
            --recursive \
            --only-show-errors
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('artifacts/edger-training/campaign/evaluation-report.json'));
            if (report.campaign_git_commit !== process.env.CAMPAIGN_GIT_SHA || !report.promotion?.passed) {
              process.exit(1);
            }
          "

      - name: Revalidate checksums and prepare the reviewed promotion change
        run: |
          npm run edger:promote:v2 -- \
            --model artifacts/edger-training/campaign/candidate.json \
            --report artifacts/edger-training/campaign/evaluation-report.json

      - name: Open promotion pull request without auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codex/edger-v2-promotion-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add artifacts/edger-training/promoted src/ai/generated/edgerPolicyCurrent.js
          git commit -m "Promote cumulative Edger v2 policy"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Promote cumulative Edger v2 policy" \
            --body "The checksum-bound candidate from campaign SHA ${CAMPAIGN_GIT_SHA} passed every immutable production gate. This PR requires manual review and merge."
