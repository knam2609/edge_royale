name: Edger Production Campaign

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Run one target stage or open promotion PR"
        required: true
        type: choice
        options:
          - run
          - promote
      campaign_sha:
        description: "Full reviewed campaign Git SHA"
        required: true
        type: string
      campaign_uri:
        description: "Target immutable S3 campaign URI"
        required: true
        type: string
      target_stage:
        description: "Terminal stage for this runner"
        required: true
        type: choice
        options:
          - full-cache
          - offline
          - full-evaluation

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: edger-production-campaign
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  EDGER_CORPUS_STORE: ${{ vars.EDGER_CORPUS_STORE }}
  EDGER_REFERENCE_HARDWARE: aws-c7g.4xlarge-ap-southeast-2
  CAMPAIGN_GIT_SHA: ${{ inputs.campaign_sha }}
  CAMPAIGN_URI: ${{ inputs.campaign_uri }}
  TARGET_STAGE: ${{ inputs.target_stage }}
  RECOVERY_MANIFEST: artifacts/edger-training/recovery/edger_scaling_recovery_v1.json
  RUN_LABEL: github-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  run-campaign:
    if: inputs.operation == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.EDGER_AWS_ROLE_ARN }}
          role-duration-seconds: 43200

      - run: npm ci

      - name: Require reviewed immutable recovery target
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$CAMPAIGN_GIT_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "$CAMPAIGN_GIT_SHA" "$GITHUB_SHA"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { validateRecoveryManifest } from './scripts/edger-scaling-recovery.mjs';
            const recovery = validateRecoveryManifest(JSON.parse(fs.readFileSync(process.env.RECOVERY_MANIFEST)));
            if (process.env.CAMPAIGN_URI !== recovery.target.campaign_uri) process.exit(1);
          "
          test "$EDGER_REFERENCE_HARDWARE" = "aws-c7g.4xlarge-ap-southeast-2"
          case "$EDGER_CORPUS_STORE" in s3://*) ;; *) exit 1 ;; esac
          echo "RECOVERY_CHECKSUM=$(shasum -a 256 "$RECOVERY_MANIFEST" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Launch or monitor matching SSM runner
        run: |
          npm run edger:campaign:remote -- launch \
            --campaign-uri "$CAMPAIGN_URI" \
            --git-sha "$CAMPAIGN_GIT_SHA" \
            --target-stage "$TARGET_STAGE" \
            --scaling-recovery-manifest "$RECOVERY_MANIFEST" \
            --run-label "$RUN_LABEL"

      - name: Monitor target marker for up to five hours
        run: |
          marker="/tmp/${TARGET_STAGE}.json"
          validate_marker() {
            aws s3 cp \
              "$CAMPAIGN_URI/status/completed/${TARGET_STAGE}.json" \
              "$marker" \
              --only-show-errors 2>/dev/null || return 1
            node --input-type=module -e "
              import fs from 'node:fs';
              import { assertCompletedStageMarker } from './scripts/edger-campaign-stages.mjs';
              assertCompletedStageMarker(JSON.parse(fs.readFileSync(process.argv[1])), {
                stage: process.env.TARGET_STAGE,
                gitCommit: process.env.CAMPAIGN_GIT_SHA,
                recoveryManifestChecksum: process.env.RECOVERY_CHECKSUM,
              });
            " "$marker"
          }
          active_count() {
            campaign_id="${CAMPAIGN_URI##*/}"
            aws ec2 describe-instances \
              --filters \
                "Name=tag:campaign,Values=${campaign_id}" \
                "Name=tag:campaign-git-sha,Values=${CAMPAIGN_GIT_SHA}" \
                "Name=tag:campaign-target-stage,Values=${TARGET_STAGE}" \
                "Name=instance-state-name,Values=pending,running" \
              --query 'length(Reservations[].Instances[])' \
              --output text
          }
          for attempt in $(seq 1 300); do
            if validate_marker; then
              exit 0
            fi
            if [ "$(active_count)" = "0" ]; then
              echo "Runner terminated without matching ${TARGET_STAGE} marker." >&2
              exit 1
            fi
            sleep 60
          done
          if validate_marker; then
            exit 0
          fi
          if [ "$(active_count)" != "0" ]; then
            echo "Runner remains active after five hours; monitor detached successfully."
            exit 0
          fi
          echo "Runner terminated without matching ${TARGET_STAGE} marker." >&2
          exit 1

  promote:
    if: inputs.operation == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.campaign_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.EDGER_AWS_ROLE_ARN }}
          role-duration-seconds: 43200

      - run: npm ci

      - name: Require completed campaign and zero active runners
        run: |
          test "$TARGET_STAGE" = "full-evaluation"
          test "$(git rev-parse HEAD)" = "$CAMPAIGN_GIT_SHA"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { validateRecoveryManifest } from './scripts/edger-scaling-recovery.mjs';
            const recovery = validateRecoveryManifest(JSON.parse(fs.readFileSync(process.env.RECOVERY_MANIFEST)));
            if (process.env.CAMPAIGN_URI !== recovery.target.campaign_uri) process.exit(1);
          "
          recovery_checksum="$(shasum -a 256 "$RECOVERY_MANIFEST" | cut -d' ' -f1)"
          echo "RECOVERY_CHECKSUM=${recovery_checksum}" >> "$GITHUB_ENV"
          aws s3 cp \
            "$CAMPAIGN_URI/status/completed/full-evaluation.json" \
            /tmp/full-evaluation.json \
            --only-show-errors
          RECOVERY_CHECKSUM="$recovery_checksum" node --input-type=module -e "
            import fs from 'node:fs';
            import { assertCompletedStageMarker } from './scripts/edger-campaign-stages.mjs';
            assertCompletedStageMarker(JSON.parse(fs.readFileSync('/tmp/full-evaluation.json')), {
              stage: 'full-evaluation',
              gitCommit: process.env.CAMPAIGN_GIT_SHA,
              recoveryManifestChecksum: process.env.RECOVERY_CHECKSUM,
            });
          "
          campaign_id="${CAMPAIGN_URI##*/}"
          active="$(aws ec2 describe-instances \
            --filters \
              "Name=tag:campaign,Values=${campaign_id}" \
              "Name=tag:campaign-git-sha,Values=${CAMPAIGN_GIT_SHA}" \
              "Name=instance-state-name,Values=pending,running" \
            --query 'length(Reservations[].Instances[])' \
            --output text)"
          test "$active" = "0"

      - name: Download and revalidate exact promotion inputs
        run: |
          mkdir -p artifacts/edger-training/campaign
          aws s3 cp \
            "$CAMPAIGN_URI/ready-for-promotion/" \
            artifacts/edger-training/campaign/ \
            --recursive \
            --only-show-errors
          node --input-type=module -e "
            import crypto from 'node:crypto';
            import fs from 'node:fs';
            const marker = JSON.parse(fs.readFileSync('/tmp/full-evaluation.json'));
            const expected = Object.fromEntries(marker.artifacts.map((artifact) => [artifact.path, artifact.sha256]));
            for (const name of ['candidate.json', 'evaluation-report.json']) {
              const bytes = fs.readFileSync('artifacts/edger-training/campaign/' + name);
              const actual = crypto.createHash('sha256').update(bytes).digest('hex');
              if (actual !== expected[name]) throw new Error(name + ' marker checksum mismatch');
            }
            const report = JSON.parse(fs.readFileSync('artifacts/edger-training/campaign/evaluation-report.json'));
            if (report.campaign_git_commit !== process.env.CAMPAIGN_GIT_SHA || !report.promotion?.passed) {
              throw new Error('evaluation report is not promotable for campaign SHA');
            }
          "
          npm run edger:promote:v2 -- \
            --model artifacts/edger-training/campaign/candidate.json \
            --report artifacts/edger-training/campaign/evaluation-report.json

      - name: Open manual-review promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="codex/edger-v2-promotion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add artifacts/edger-training/promoted src/ai/generated/edgerPolicyCurrent.js
          git commit -m "Promote cumulative Edger v2 policy"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Promote cumulative Edger v2 policy" \
            --body "Checksum-bound candidate from campaign SHA ${CAMPAIGN_GIT_SHA} passed every immutable production gate. Manual review and merge required."
