name: Strict Fair Ladder Promotion

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Daily ladder training run id to download candidate fair artifacts from
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  RUN_ROOT: artifacts/training/runs/daily-${{ github.event.inputs.source_run_id }}
  CANDIDATE_MANIFEST: artifacts/training/runs/daily-${{ github.event.inputs.source_run_id }}/candidate-ladder-models.json
  STRICT_SUMMARY: artifacts/training/runs/daily-${{ github.event.inputs.source_run_id }}/strict-comparison-summary.json
  PR_BODY: artifacts/training/runs/daily-${{ github.event.inputs.source_run_id }}/pull-request-body.md

jobs:
  promote:
    name: Promote fair ladder models
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download daily training artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          gh run download "$SOURCE_RUN_ID" \
            --name "ladder-training-$SOURCE_RUN_ID" \
            --dir "$RUN_ROOT"

      - name: Run strict fair gate
        id: strict
        env:
          SUMMARY_PATH: ${{ env.STRICT_SUMMARY }}
        run: |
          node scripts/strict-ladder-gate.mjs \
            --baseline-manifest artifacts/training/ladder-models.json \
            --candidate-manifest "$CANDIDATE_MANIFEST" \
            --out "$STRICT_SUMMARY" \
            --seed-base 1909 \
            --batches 5 \
            --rounds 100 \
            --max-ticks 6040
          echo "strict_passed=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const summary = JSON.parse(readFileSync(process.env.SUMMARY_PATH, 'utf8')); console.log(summary.gate?.passed ? 'true' : 'false');")" >> "$GITHUB_OUTPUT"

      - name: Upload strict fair gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-fair-ladder-${{ github.event.inputs.source_run_id }}
          path: ${{ env.RUN_ROOT }}
          retention-days: 14
          if-no-files-found: warn

      - name: Promote passing fair candidate
        id: promote
        if: steps.strict.outputs.strict_passed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin training/daily-ladder-models || true
          git switch -C training/daily-ladder-models
          node scripts/promote-ladder-models.mjs \
            --candidate-manifest "$CANDIDATE_MANIFEST" \
            --comparison-summary "$STRICT_SUMMARY" \
            --promote-fair \
            --run-root "$RUN_ROOT" \
            --pr-body-out "$PR_BODY"
          git add artifacts/training/ladder-models.json artifacts/training/promoted
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Promote strict fair ladder models"
            git push --force-with-lease origin training/daily-ladder-models
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update model PR
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LADDER_MODEL_PR_TOKEN || github.token }}
        run: |
          existing_pr="$(gh pr list --head training/daily-ladder-models --base main --state open --json number --jq '.[0].number')"
          pr_status=0
          if [ -z "$existing_pr" ]; then
            pr_output="$(gh pr create --base main --head training/daily-ladder-models --title "Update daily ladder models" --body-file "$PR_BODY" 2>&1)" || pr_status=$?
          else
            pr_output="$(gh pr edit "$existing_pr" --title "Update daily ladder models" --body-file "$PR_BODY" 2>&1)" || pr_status=$?
          fi
          if [ "$pr_status" -ne 0 ]; then
            echo "$pr_output"
            echo "::warning::Could not create or update the strict fair ladder PR. Branch training/daily-ladder-models was pushed; enable Action-created PRs or configure LADDER_MODEL_PR_TOKEN."
          else
            echo "$pr_output"
          fi
